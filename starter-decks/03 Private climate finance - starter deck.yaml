- role: situation
  archetype: statement
  title: The UAE has committed $163 billion to net zero against a need near $680 billion
  statement: Public commitment covers roughly a quarter of what the transition is estimated to cost.
  points_heading: Key facts
  points:
  - $163 billion committed by the UAE
  - $680 billion is the estimated total need
  - Alterra aims to draw $250 billion by 2030
  source: US State Dept (2024); Standard Chartered via BCG (2022)
  notes: Taken from the challenge brief. Check it, and change it if your work has moved on. The jury knows
    this material, so spend your time on what you add to it.
- role: complication
  archetype: statement
  title: Private capital holds the money but sees little reason to deploy it
  statement: Without a carbon price or a clear return, climate projects lose to everything else on the
    balance sheet.
  points_heading: Key facts
  points:
  - Public money alone cannot close a gap that size
  - Blame falls on immature technology and weak disclosure
  - Private companies hold most of the capital
  source: CNBC (Aug 2026); UK Green Investment Bank (2015)
  notes: Taken from the challenge brief. Check it, and change it if your work has moved on. The jury knows
    this material, so spend your time on what you add to it.
