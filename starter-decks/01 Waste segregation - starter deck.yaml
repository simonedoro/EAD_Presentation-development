- role: situation
  archetype: statement
  title: Abu Dhabi is building the capacity to divert 80% of waste from landfill by 2031
  statement: Fifty-one initiatives, new recovery facilities, a waste-to-energy plant and a bigger fleet
    are under way.
  points_heading: Key facts
  points:
  - 37.7% of waste diverted from landfill in 2025
  - 80% is the target for 2031
  - First two-bin pilot starts in Shakhbout City, September 2026
  source: The National (Jul 2026); Tadweer ESG Report 2025
  notes: Taken from the challenge brief. Check it, and change it if your work has moved on. The jury knows
    this material, so spend your time on what you add to it.
- role: complication
  archetype: statement
  title: The new plants cannot recover what arrives, because the waste comes in mixed
  statement: Sorting plants expect to recover only 15 to 20% of what they receive as clean recyclables.
  points_heading: Key facts
  points:
  - Years of campaigns have changed household habits little
  - Most towers have a single rubbish chute
  - Families have never made sorting part of the routine
  source: Tadweer ESG Report 2025; Korean Ministry of Environment (2024)
  notes: Taken from the challenge brief. Check it, and change it if your work has moved on. The jury knows
    this material, so spend your time on what you add to it.
