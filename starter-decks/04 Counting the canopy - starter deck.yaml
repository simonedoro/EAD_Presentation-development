- role: situation
  archetype: statement
  title: The UAE has pledged 100 million mangroves by 2030 and has planted 44 million
  statement: Planting is running at pace, and every seedling that goes in the ground is counted.
  points_heading: Key facts
  points:
  - 100 million mangroves pledged by 2030
  - Around 44 million already in the ground
  - Debate focuses on species, nurseries and irrigation
  source: The National (Dec 2023; Mar 2026); Abu Dhabi Mangrove Initiative (2023)
  notes: Taken from the challenge brief. Check it, and change it if your work has moved on. The jury knows
    this material, so spend your time on what you add to it.
- role: complication
  archetype: statement
  title: Planting is counted carefully, survival is barely counted at all
  statement: At one Fujairah site only 28% of seedlings were alive after two years. The rest are unknown.
  points_heading: Key facts
  points:
  - 28% survival after two years at one site
  - No survival figure exists for most sites
  - Faster planting is treated as the priority
  source: The National (Mar 2026); EAD Mangrove Restoration Guidelines
  notes: Taken from the challenge brief. Check it, and change it if your work has moved on. The jury knows
    this material, so spend your time on what you add to it.
