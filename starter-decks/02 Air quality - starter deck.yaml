- role: situation
  archetype: statement
  title: Fine dust in Abu Dhabi runs at over six times the WHO guideline
  statement: PM2.5 averaged 32 micrograms per cubic metre in 2024, against a WHO annual guideline of 5.
  points_heading: Key facts
  points:
  - 22 EAD monitoring stations, 20 fixed and 2 mobile
  - 40% of PM2.5 is pollution blown in from outside
  - 25% is desert dust
  source: IQAir World Air Quality Report 2024; EAD Air Quality Report 2022
  notes: Taken from the challenge brief. Check it, and change it if your work has moved on. The jury knows
    this material, so spend your time on what you add to it.
- role: complication
  archetype: statement
  title: Nobody can say which source drives a bad day, so every fix is a guess
  statement: The authorities cannot predict the next spike or say which neighbourhoods breathe the worst
    of it.
  points_heading: Key facts
  points:
  - Greening, traffic limits and industry caps all compete
  - Desert dust is treated as beyond control
  - Residents get no warning before a spike
  source: EAD Air Quality Report 2022 and source study; Beijing EEB (2025)
  notes: Taken from the challenge brief. Check it, and change it if your work has moved on. The jury knows
    this material, so spend your time on what you add to it.
