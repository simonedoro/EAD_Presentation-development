    note: 2024 average against the WHO guideline
    highlight: true
  - value: '22'
    label: EAD monitoring stations
    note: 20 fixed and 2 mobile
  - value: 48h
    label: Warning residents get today
    note: None
  takeaway: The monitoring exists. The warning does not.
  notes: Pre-filled from the challenge brief. Change it if your work has moved on. The jury knows this
    material, so spend your time on what you add to it.
- role: complication
  archetype: chart
  title: Two thirds of Abu Dhabi's fine dust comes from outside the city or the desert
  source: EAD Air Quality Report 2022 and source study; Beijing EEB (2025)
  chart_type: bar
  unit: Share of PM2.5
  categories:
  - Blown in from outside
  - Desert dust
  - Everything else
  series:
  - name: Share of PM2.5
    values:
    - 40
    - 25
    - 35
  read_heading: What this says
  read:
  - 40% is human-made pollution from outside
  - 25% is desert dust
  - Only the remainder is clearly local to act on
  notes: Pre-filled from the challenge brief. If you have better numbers, use yours and say where they
    came from.
